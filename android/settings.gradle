include ':app'

// This links the Capacitor Android library from your node_modules
include ':capacitor-android'
project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')

// This dynamically includes any Capacitor plugins you have installed
def plugins = []
def inputFile = new File("../package.json")
def packageJson = new groovy.json.JsonSlurper().parseText(inputFile.text)
packageJson.dependencies.each { name, version ->
    if (name.startsWith("@capacitor/") || name.startsWith("capacitor-")) {
        def pluginDir = new File("../node_modules/${name}/android")
        if (pluginDir.exists()) {
            plugins.add([name: name, path: "../node_modules/${name}/android"])
        }
    }
}

plugins.each { plugin ->
    def pluginProjectName = ":${plugin.name.replace('/', '-').replace('@', '')}"
    include pluginProjectName
    project(pluginProjectName).projectDir = new File(plugin.path)
}
