include ':app'

rootProject.name = "android"

// Manually include the Capacitor Android library from node_modules
def capacitorDir = new File(settingsDir, '../node_modules/@capacitor/android/capacitor')
if (capacitorDir.exists()) {
    include ':capacitor-android'
    project(':capacitor-android').projectDir = capacitorDir
}

// This block helps discover Capacitor plugins if the standard apply-from fails
def pluginDir = new File(settingsDir, '../node_modules/@capacitor/android/capacitor/plugin.gradle')
if (pluginDir.exists()) {
    apply from: pluginDir
}
