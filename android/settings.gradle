include ':app'

// This is the critical manual resolution for the Capacitor Android project
// It allows Gradle to find the native bridge code in your node_modules
project(':capacitor-android').projectDir = new File(settingsDir, '../node_modules/@capacitor/android/capacitor')

// Auto-include Capacitor plugins from node_modules
def localProperties = new Properties()
def localPropertiesFile = new File(settingsDir, 'local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

apply from: '../node_modules/@capacitor/android/capacitor/capacitor.settings.gradle'
