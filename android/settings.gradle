include ':app'

// Standard Capacitor 7 inclusion method. 
// This script automatically includes ':capacitor-android' and all installed Capacitor plugins.
def capacitorSettings = new File(settingsDir, '../node_modules/@capacitor/android/capacitor/capacitor.settings.gradle')

if (capacitorSettings.exists()) {
    apply from: capacitorSettings
} else {
    // Manual fallback if the script is not found (though npm install should provide it)
    include ':capacitor-android'
    project(':capacitor-android').projectDir = new File(settingsDir, '../node_modules/@capacitor/android/capacitor')
}
