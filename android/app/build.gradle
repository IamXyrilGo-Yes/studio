apply plugin: 'com.android.application'

android {
    namespace "com.xyloan.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.xyloan.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Strings and resources settings for the app
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$rootProject.ext.androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$rootProject.ext.androidxCoreVersion"
    implementation project(':capacitor-android')

    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.ext.androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.ext.androidxEspressoCoreVersion"

    // Include Capacitor plugins
    def inputFile = new File("../../package.json")
    def packageJson = new groovy.json.JsonSlurper().parseText(inputFile.text)
    packageJson.dependencies.each { name, version ->
        if (name.startsWith("@capacitor/") || name.startsWith("capacitor-")) {
            def pluginProjectName = ":${name.replace('/', '-').replace('@', '')}"
            if (findProject(pluginProjectName) != null) {
                implementation project(pluginProjectName)
            }
        }
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
